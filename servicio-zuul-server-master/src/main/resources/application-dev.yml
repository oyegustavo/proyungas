spring:
  main:
    web-application-type: reactive
  application:
    name: zuul-server
  webflux:
    multipart:
      enabled: true
      max-file-size: 7700KB
      max-request-size: 7700KB
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: algun_codigo_secreto_aeiou_mas_largo_123456
  cloud:
    gateway:
      routes:
        - id: security
          uri: lb://servicio-oauth
          predicates:
            - Path=/api/security/oauth/**
          filters:
            - RewritePath=/api/security/(?<segment>.*), /${segment}

        - id: gestor
          uri: lb://proyungas-gestor
          predicates:
            - Path=/api/gestor/**
          filters:
            - RewritePath=/api/gestor/(?<segment>.*), /${segment}

        - id: files
          uri: lb://proyungas-files
          predicates:
            - Path=/api/files/**
          filters:
            - RewritePath=/api/files/(?<segment>.*), /${segment}

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: http://servicio-eureka-server:8761/eureka
